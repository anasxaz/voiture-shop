services:

  postgres:
    image: postgres:16
    container_name: voiture_shop_db
    environment:
      POSTGRES_DB: voituredb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d voituredb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./SpringDataRest
    container_name: voiture_shop_backend
    ports:
      - "8089:8089"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./myapp
    container_name: voiture_shop_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
