spring.application.name=SpringDataRest
spring.config.import=optional:classpath:application-local.properties
server.port=8089

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/voituredb
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (desactivee avec PostgreSQL)
# spring.h2.console.enabled=true

spring.data.rest.base-path=/api

jwt.secret=Vm9pdHVyZVNob3BKd3RTZWNyZXRLZXkyMDI2RU5TSUFTdXBlclNlY3VyZUtleQ==

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama2

# Swagger / OpenAPI
springdoc.enable-data-rest=false
springdoc.enable-hateoas=false
springdoc.swagger-ui.path=/swagger-ui.html

